name: Daily README dot
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append a dot to README and commit
        run: |
          printf '.' >> README.md
          git config user.name "borzz222"
          git config user.email "324807937+borzz222@users.noreply.github.com"
          git add README.md
          git commit -m "."
          git push
